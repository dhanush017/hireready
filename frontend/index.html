<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230ea5e9'><path d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireReady AI — Your AI Placement Copilot</title>
    <meta name="description" content="Bridge the gap between your resume and dream tech internship. Transparent match scoring, skill gap breakdown, 4-week roadmap, and AI interview practice." />
  </head>
  <body>
    <script>
      // Apply the saved (or system) theme before paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
